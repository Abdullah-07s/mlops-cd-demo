name: Continuous Delivery

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Test
        run: python -m pytest

  build:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      name: ${{ steps.repo.outputs.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Get version
        id: version
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Lowercase repository name
        id: repo
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build
        run: |
          docker build \
            -t ghcr.io/${{ steps.repo.outputs.name }}:${{ steps.version.outputs.version }} \
            -t ghcr.io/${{ steps.repo.outputs.name }}:latest \
            .
      - name: Push
        run: |
          docker push ghcr.io/${{ steps.repo.outputs.name }}:${{ steps.version.outputs.version }}
          docker push ghcr.io/${{ steps.repo.outputs.name }}:latest

  deploy-staging:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: staging
    steps:
      - name: Deploy to staging (on runner, no external VM)
        run: |
          docker pull ghcr.io/${{ needs.build.outputs.name }}:${{ needs.build.outputs.version }}
          docker run -d \
            --name mlops-api-staging \
            -p 5000:5000 \
            ghcr.io/${{ needs.build.outputs.name }}:${{ needs.build.outputs.version }}
      - name: Smoke test
        run: |
          sleep 5
          curl --fail http://localhost:5000/health
      - name: Stop staging container
        if: always()
        run: docker rm -f mlops-api-staging || true

  deploy-production:
    needs:
      - build
      - deploy-staging
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Deploy to production (on runner, no external VM)
        run: |
          docker pull ghcr.io/${{ needs.build.outputs.name }}:${{ needs.build.outputs.version }}
          docker run -d \
            --name mlops-api-prod \
            -p 5000:5000 \
            ghcr.io/${{ needs.build.outputs.name }}:${{ needs.build.outputs.version }}
      - name: Verify production health
        run: |
          sleep 5
          curl --fail http://localhost:5000/health
      - name: Stop production container
        if: always()
        run: docker rm -f mlops-api-prod || true
